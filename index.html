          <a href="#" class="text-xs text-sky-600 hover:text-sky-700">Esqueci minha senha</a>

        <input type="password" value="••••••••••" class="w-full mb-6 px-3.5 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500/30 focus:border-sky-500">

        <a href="novo-laudo.html" class="block w-full text-center bg-sky-600 hover:bg-sky-700 text-white font-medium py-2.5 rounded-lg shadow-sm transition">Entrar</a>
      </form>

      <div class="mt-6 pt-6 border-t border-slate-100 text-center text-sm text-slate-500">
        Ainda não tem cadastro? <a href="#" class="text-sky-600 font-medium hover:text-sky-700">Solicitar acesso</a>
